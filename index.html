.hero{text-shadow:0 1px 12px var(--paper)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:720px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .col{display:grid;gap:10px;padding-block:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;text-wrap:balance}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.picker{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.picker button,.picker select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.picker button{font-size:20px;cursor:pointer}
.picker button:disabled{opacity:.35;cursor:default}
.picker select{padding:0 12px;font-weight:600;min-width:0;width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabs .today{margin-left:auto;border-color:var(--accent);color:var(--accent)}

main .col{display:grid;gap:14px;padding-block:16px 40px}

/* hero */
.hero{display:grid;gap:6px;padding:4px 2px 2px}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero h2{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(44px,12vw,72px);line-height:.92;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.hero .sub{font-weight:500}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink);background:var(--card);white-space:nowrap}
.chip.show{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.hotel{background:var(--hotel-bg);color:var(--hotel);border-color:transparent}
.chip.nightliner{background:var(--bus-bg);color:var(--bus);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* sleep banner */
.sleep{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-radius:14px;padding:14px 16px;border:1px solid transparent}
.sleep.hotel{background:var(--hotel-bg);color:var(--hotel)}
.sleep.nightliner{background:var(--bus-bg);color:var(--bus)}
.sleep.home,.sleep.none{background:var(--card);border-color:var(--line)}
.sleep svg{width:44px;height:44px}
.sleep .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sleep .what{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase}
.sleep .det{color:var(--ink);font-size:14px;margin-top:4px;min-width:0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
.sec-h small{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.tl{display:grid}
.tl-row{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0;padding-top:0}
.tl-time{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;padding-top:1px;white-space:nowrap}
.tl-body{min-width:0;display:grid;gap:2px}
.tl-title{font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;justify-content:space-between}
.tl-who{font-size:12px;color:var(--muted);font-weight:500}
.tl-detail{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.tl-row.key .tl-title{color:var(--accent)}
.tl-row.now{background:linear-gradient(90deg,var(--accent-soft),transparent);margin-inline:-16px;padding-inline:16px}

.place-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.place-h strong{font-size:18px}
.stars{color:var(--bus);letter-spacing:2px;font-size:14px}
.desc{margin:0;color:var(--muted);max-width:65ch}
.callout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.callout div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.callout b{display:block;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.callout span{font-weight:600;font-variant-numeric:tabular-nums}
.addr{display:grid;gap:2px}
.addr .links{font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 14px;margin:0}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.meal{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:0}
.meal-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.meal small{color:var(--muted);font-size:14px}
.nb{display:grid;gap:1px;padding:10px 0;border-top:1px solid var(--line)}
.nb a{font-weight:600}
.nb small{color:var(--muted);font-size:13px}
.desc+.nb,.grp+.nb{border-top:0;padding-top:0}
.grp{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--bus);padding-top:8px}
.src{margin:0;font-size:12px;color:var(--muted)}
.wx{gap:8px}
.wx-row{display:flex;align-items:center;gap:14px}
.wx-row svg{width:46px;height:46px;flex:0 0 auto;color:var(--accent)}
.wx-t{display:flex;align-items:baseline;gap:8px;font-family:var(--display);text-transform:uppercase}
.wx-t b{font-size:36px;line-height:1}
.wx-t span{font-size:22px;color:var(--muted)}
.wx-bits{font-size:14px;color:var(--muted)}
.fact{background:var(--accent-soft);border-color:transparent}
.fact-t{margin:0;font-size:17px;font-weight:500;max-width:60ch;text-wrap:pretty}
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;border-radius:14px;padding:14px 16px;background:var(--ink);color:var(--card);cursor:pointer;font-size:15px}
.nextbar b{font-weight:600}
.nextbar span:last-child{font-size:22px}
.login{max-width:420px;padding-top:8vh}
.login-h{margin:0;font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;line-height:1}
.remember{display:flex;gap:8px;align-items:center;font-size:14px}
.brand h1{flex:1;min-width:0}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:-4px}
.tm b{color:var(--ink);font-weight:600}
.tm .mono{font-size:13px}
.wa{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:#1f9d55;color:#fff;font-weight:600;font-size:12px;text-decoration:none;letter-spacing:.02em}
.admin{flex:0 0 auto;border:1px dashed var(--bus);color:var(--bus);background:transparent;border-radius:999px;padding:3px 12px;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.admin[aria-pressed="true"]{background:var(--bus);border-color:var(--bus);color:var(--card);border-style:solid}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.adminbar{border:1px dashed var(--bus);color:var(--bus);background:var(--bus-bg);border-radius:10px;padding:8px 12px;font-size:13px}
.copyline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.mono{font-family:var(--mono);font-size:14px}
.copy{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.empty{color:var(--muted);margin:0}

/* route */
.route{display:grid}
.r-row{display:grid;grid-template-columns:86px 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;width:100%}
.r-row:first-child{border-top:0}
.r-date{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.r-date.past{color:var(--muted)}
.r-city{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;line-height:1}
.r-venue{color:var(--muted);font-size:13px}
.r-main{min-width:0;display:grid;gap:2px}
.r-tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.r-row[aria-current="true"] .r-city{color:var(--accent)}

/* contacts */
.ct{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.ct:first-of-type{border-top:0;padding-top:0}
.ct-role{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes p{margin:0 0 6px;max-width:65ch}

/* editor */
.editbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.sheet{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .col{display:grid;gap:14px;padding-block:16px 60px}
.sheet h3{margin:0;font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase}
fieldset{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:grid;gap:12px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:0 6px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:13px;font-weight:600}
.f .hint{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 10px;min-width:0}
.f textarea{min-height:110px;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.status{font-size:14px;color:var(--muted)}
.status.err{color:var(--warn)}
.sheet-actions{position:sticky;bottom:0;background:var(--paper);padding-block:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: no-preference){.card,.sleep{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

function unlock(key,remember,admin){
  return decryptWith(key).then(function(d){
    KEY=key;data=norm(d);st.isAdmin=!!admin;if(!admin)st.admin=false;initState();setTimeout(liveWeather,0);
    if(remember){crypto.subtle.exportKey('raw',key).then(function(r){try{localStorage.setItem('daysheet-key-'+ENC.salt,b64(r));localStorage.setItem('daysheet-role-'+ENC.salt,admin?'admin':'band');}catch(e){}});}
    render();
  });
}
function tryRemembered(){
  var r=null;try{r=localStorage.getItem('daysheet-key-'+ENC.salt);}catch(e){}
  if(!r)return Promise.reject();
  var role=null;try{role=localStorage.getItem('daysheet-role-'+ENC.salt);}catch(e){}
  return crypto.subtle.importKey('raw',unb64(r),{name:'AES-GCM'},true,['encrypt','decrypt']).then(function(k){return unlock(k,false,role==='admin');});
}
function signOut(){try{localStorage.removeItem('daysheet-key-'+ENC.salt);localStorage.removeItem('daysheet-role-'+ENC.salt);}catch(e){}KEY=null;st.isAdmin=false;st.admin=false;data=load();st.edit=null;render();}

function render(){
  if(ENC&&!KEY){app.innerHTML=loginView();return;}
  var html=header();
  html+='<main class="gut"><div class="col">';
  if(st.notice)html+='<div class="adminbar" role="status">'+esc(st.notice)+'</div>';
  if((ENC?st.isAdmin:(st.canWrite||standalone()))&&st.admin)html+='<div class="adminbar">'+(standalone()?(ghToken()?'Admin mode: Save publishes straight to the website. ':'Admin mode: Save downloads an updated index.html. Connect the website to publish with one click. ')+'<button type="button" class="linkbtn" data-act="gh-open">Website settings</button>':'Admin mode: you can edit days, contacts and notes. Changes are visible to everyone after saving.')+'</div>';
  if(!data.days.length&&st.view!=='contacts')html+=emptyTour();
  else if(st.view==='route')html+=routeView();
  else if(st.view==='contacts')html+=contactsView();
  else html+=dayView(dayBy(st.date));
  html+='</div></main>';
  if(st.edit)html+=editor();
  if(st.ghSettings)html+=ghSettingsView();
  if(st.adminLogin)html+='<div class="sheet gut" role="dialog" aria-modal="true" aria-label="Admin sign in"><div class="col login"><form class="card" id="adminform">'+
    '<h2 class="login-h">Admin</h2><p class="desc">Sign in as admin to edit days, contacts and notes.</p>'+
    '<div class="f"><label for="al_user">Login</label><input id="al_user" value="Admin" autocomplete="username" autocapitalize="off" required></div>'+
    '<div class="f"><label for="al_pw">Password</label><input id="al_pw" type="password" autocomplete="current-password" required></div>'+
    (st.loginMsg?'<p class="status err" role="alert">'+esc(st.loginMsg)+'</p>':'')+
    '<div class="btns"><button class="btn primary" type="submit">Sign in as admin</button><button class="btn" type="button" data-act="admin-cancel">Cancel</button></div></form></div></div>';
  app.innerHTML=html;
  document.body.style.overflow=st.edit?'hidden':'';
  var n=app.querySelector('.tl-row.now');
  if(n&&!render.scrolled){render.scrolled=true;}
}

function header(){
  var i=idxOf(st.date),opts='';
  data.days.forEach(function(d){opts+='<option value="'+d.date+'"'+(d.date===st.date?' selected':'')+'>'+esc(fmtShort(d.date)+' · '+(d.city||'—'))+'</option>';});
  var hasToday=!!dayBy(todayISO());
  return '<header class="top gut"><div class="col">'+
    '<div class="brand"><h1>'+esc(data.tour.name||'Tour')+'</h1><span>'+esc(data.tour.subtitle||'Daysheet')+'</span>'+((ENC&&KEY)||st.canWrite||standalone()?'<button type="button" class="admin" data-act="admin" aria-pressed="'+!!st.admin+'">Admin</button>':'')+'</div>'+tmLine()+
    (data.days.length?'<div class="picker"><button type="button" data-act="prev" aria-label="Previous day"'+(i<=0?' disabled':'')+'>‹</button>'+
    '<select id="daysel" aria-label="Choose day">'+opts+'</select>'+
    '<button type="button" data-act="next" aria-label="Next day"'+(i<0||i>=data.days.length-1?' disabled':'')+'>›</button></div>':'')+
    '<nav class="tabs" aria-label="Sections">'+
      tab('day','Day')+tab('route','Route')+tab('contacts','Contacts')+
      (hasToday?'<button type="button" class="today" data-act="today">Today</button>':'')+
    '</nav></div></header>';
}
function tmLine(){
  var t=data.tour||{};if(!t.tmPhone)return '';

  return '<div class="tm"><span>Tour manager <b>'+esc(t.tmName||'')+'</b></span><span class="mono">'+esc(t.tmPhone)+'</span>'+
    '<a class="wa" href="https://wa.me/'+num+'" target="_blank" rel="noopener">WhatsApp</a></div>';

function tab(v,l){return '<button type="button" data-act="view" data-v="'+v+'" aria-current="'+(st.view===v)+'">'+l+'</button>';}

function emptyTour(){
  return '<div class="card"><h2 class="sec-h">No days yet</h2><p class="empty">Each tour day gets a daysheet here with the schedule, venue, hotel or nightliner, and food.</p>'+

function dayView(d){
  if(!d)return '';
  var h='';
  var kind=d.kind||'show';
  h+='<section class="hero"><div class="kicker"><span>'+esc(fmtLong(d.date))+'</span>'+
    '<span class="chip '+(kind==='show'?'show':'')+'">'+esc(KIND[kind]||kind)+'</span>'+
    (d.date===todayISO()?'<span class="chip ok">Today</span>':'')+'</div>'+
    '<h2>'+esc(d.city||'—')+'</h2>';
  var line=[];if(d.venue&&d.venue.name)line.push(d.venue.name);if(d.showTime)line.push('Show '+d.showTime);
  if(line.length)h+='<div class="sub">'+esc(line.join(' · '))+'</div>';
  if(d.summary)h+='<p>'+esc(d.summary)+'</p>';
  h+='</section>';
  h+=sleepBanner(d);
  h+=weatherCard(d);
  h+=timesCard(d);
  var partHotel=d.hotel&&d.hotel.name&&d.hotel.who;
  if(d.sleep==='nightliner')h+=busCard(d);
  if(d.sleep==='hotel'||partHotel)h+=hotelCard(d);
  h+=venueCard(d);
  h+=mealsCard(d);
  h+=nearbyCard(d);
  h+=essentialsCard(d);
  h+=cityCard(d);
  h+=nextBar(d);
  if((ENC?st.isAdmin:(st.canWrite||standalone()))&&st.admin)h+='<div class="editbar"><button class="btn" data-act="new">New day</button><button class="btn" data-act="dup">Duplicate day</button><button class="btn primary" data-act="edit">Edit day</button></div>';
  return h;
}

function sleepBanner(d){
  var s=d.sleep||'none',det='';
  if(s==='hotel'){var ho=d.hotel||{};det=[ho.name,ho.checkOut?'Check-out '+ho.checkOut:''].filter(Boolean).join(' · ');}
  else if(s==='nightliner'){var b=d.bus||{},hx=d.hotel||{};det=[b.call?'Bus Call '+b.call:'',b.to?'Driving to '+b.to:''].filter(Boolean).join(' · ');if(hx.name&&hx.who)det+=(det?'. ':'')+hx.who+': '+hx.name;}
  else if(s==='home')det='No accommodation booked, you sleep at home.';
  else det='Accommodation not confirmed yet.';
  return '<section class="sleep '+s+'" aria-label="Accommodation">'+(IC[s]||IC.none)+
    '<div style="min-width:0"><div class="lbl">Tonight</div><div class="what">'+esc(SLEEP[s]||s)+'</div>'+
    (det?'<div class="det">'+esc(det)+'</div>':'')+'</div></section>';
}

function wxText(sym){
  sym=String(sym||'').replace(/_(day|night|polartwilight)$/,'');
  var M={clearsky:'Clear sky',fair:'Fair',partlycloudy:'Partly cloudy',cloudy:'Cloudy',fog:'Fog',rain:'Rain',lightrain:'Light rain',heavyrain:'Heavy rain',rainshowers:'Rain showers',lightrainshowers:'Light rain showers',heavyrainshowers:'Heavy rain showers',sleet:'Sleet',lightsleet:'Light sleet',sleetshowers:'Sleet showers',snow:'Snow',lightsnow:'Light snow',heavysnow:'Heavy snow',snowshowers:'Snow showers',rainandthunder:'Rain and thunder',rainshowersandthunder:'Thundery showers'};
  return M[sym]||sym.replace(/([a-z])(and|showers|thunder)/g,'$1 $2').replace(/^./,function(c){return c.toUpperCase();});
}
function wxIcon(sym){
  sym=String(sym||'');
  var p='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  var cloud='<path d="M14 34h20a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0-1 16z"/>';
  if(/clearsky|fair/.test(sym))return p+'<circle cx="24" cy="24" r="8"/><path d="M24 6v4M24 38v4M6 24h4M38 24h4M11 11l3 3M34 34l3 3M11 37l3-3M34 14l3-3"/></svg>';
  if(/snow|sleet/.test(sym))return p+cloud+'<path d="M18 40v.5M24 42v.5M30 40v.5"/></svg>';
  if(/rain|thunder/.test(sym))return p+cloud+'<path d="M18 38l-2 4M25 38l-2 4M32 38l-2 4"/></svg>';
  return p+cloud+'</svg>';
}
var WMO={0:'clearsky',1:'fair',2:'partlycloudy',3:'cloudy',45:'fog',48:'fog',51:'lightrain',53:'lightrain',55:'rain',56:'lightsleet',57:'sleet',61:'lightrain',63:'rain',65:'heavyrain',66:'lightsleet',67:'sleet',71:'lightsnow',73:'snow',75:'heavysnow',77:'snow',80:'lightrainshowers',81:'rainshowers',82:'heavyrainshowers',85:'snowshowers',86:'snowshowers',95:'rainandthunder',96:'rainandthunder',99:'rainandthunder'};
function liveWeather(){
  if(!standalone()||!window.fetch||liveWeather.done)return;liveWeather.done=true;
  var t=todayISO(),end=addDays(t,15),groups={},keys=[];
  data.days.forEach(function(d){if(d.date>=t&&d.date<=end&&d.lat!=null&&d.lon!=null){var k=d.lat+','+d.lon;if(!groups[k]){groups[k]=[];keys.push(k);}groups[k].push(d);}});
  if(!keys.length)return;
  var lat=keys.map(function(k){return k.split(',')[0];}).join(','),lon=keys.map(function(k){return k.split(',')[1];}).join(',');
  var u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto&forecast_days=16';
  fetch(u).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
    var arr=Array.isArray(j)?j:[j],now=new Date(),stamp=now.getDate()+' '+MON[now.getMonth()]+' '+pad(now.getHours())+':'+pad(now.getMinutes());
    arr.forEach(function(loc,i){var dl=loc.daily;if(!dl)return;groups[keys[i]].forEach(function(d){
      var k=dl.time.indexOf(d.date);if(k<0||dl.temperature_2m_max[k]==null)return;
      d.weather={min:Math.round(dl.temperature_2m_min[k]),max:Math.round(dl.temperature_2m_max[k]),symbol:WMO[dl.weather_code[k]]||'cloudy',
        precip:Math.round(dl.precipitation_sum[k]*10)/10,wind:Math.round(dl.wind_speed_10m_max[k]),updated:stamp+' (live)',source:'Open-Meteo'};
    });});
    if(!st.edit&&!st.adminLogin)render();
  }).catch(function(){});
}
function weatherCard(d){
  var w=d.weather;
  if(!w||w.max==null)return '';
  var bits=[];
  if(w.precip!=null)bits.push('Rain '+w.precip+' mm');
  if(w.wind!=null)bits.push('Wind up to '+w.wind+' km/h');
  return '<section class="card wx"><div class="wx-row">'+wxIcon(w.symbol)+'<div class="wx-main"><div class="wx-t"><b>'+esc(w.max)+'°</b><span>'+esc(w.min)+'°</span></div><div>'+esc(wxText(w.symbol))+'</div></div></div>'+
    (bits.length?'<div class="wx-bits">'+esc(bits.join(' · '))+'</div>':'')+
    '<p class="src">Forecast: '+esc(w.source||'MET Norway')+' · updated '+esc(w.updated||'')+'</p></section>';
}
function nowIdx(d){
  if(d.date!==todayISO()||!d.schedule)return -1;
  var n=new Date(),m=n.getHours()*60+n.getMinutes(),best=-1;
  d.schedule.forEach(function(r,i){var t=/^(\d{1,2}):(\d{2})/.exec(r.time||'');if(t&&(+t[1]*60+ +t[2])<=m)best=i;});
  return best;
}
function timesCard(d){
  var rows=d.schedule||[];
  var h='<section class="card"><h3 class="sec-h">Times today<small>Local time</small></h3>';
  if(!rows.length)return h+'<p class="empty">No schedule yet.</p></section>';
  var ni=nowIdx(d);
  h+='<div class="tl">';
  rows.forEach(function(r,i){
    var key=/show|doors|bus call|departure|pickup|soundcheck|flight/i.test(r.title||'');
    h+='<div class="tl-row'+(key?' key':'')+(i===ni?' now':'')+'"><div class="tl-time">'+esc(r.time||'')+'</div><div class="tl-body">'+
      '<div class="tl-title"><span>'+esc(r.title||'')+'</span>'+(r.who?'<span class="tl-who">'+esc(r.who)+'</span>':'')+'</div>'+
      (r.detail?'<div class="tl-detail">'+esc(r.detail)+'</div>':'')+'</div></div>';
  });
  return h+'</div></section>';
}
function addrBlock(a){
  if(!a)return '';

}
function phoneLine(p){
  if(!p)return '';
  return '<div class="copyline"><span class="mono">'+esc(p)+'</span><button type="button" class="copy" data-act="copy" data-v="'+esc(p)+'">Copy</button></div>';
}
function hotelCard(d){
  var ho=d.hotel||{};
  var h='<section class="card"><h3 class="sec-h">Hotel'+(ho.who?'<small>'+esc(ho.who)+'</small>':'')+'</h3>';
  h+='<div class="place-h"><strong>'+esc(ho.name||'Hotel TBC')+'</strong>'+(ho.stars?'<span class="stars" aria-label="'+ho.stars+' stars">'+'★'.repeat(Math.min(5,+ho.stars||0))+'</span>':'')+'</div>';
  if(ho.description)h+='<p class="desc">'+esc(ho.description)+'</p>';
  if(ho.checkIn||ho.checkOut)h+='<div class="callout">'+(ho.checkIn?'<div><b>Check-in</b><span>'+esc(ho.checkIn)+'</span></div>':'')+(ho.checkOut?'<div><b>Check-out</b><span>'+esc(ho.checkOut)+'</span></div>':'')+'</div>';
  h+=addrBlock(ho.address);
  var b='';
  if(ho.website)b+='<a class="btn" href="'+esc(url(ho.website))+'" target="_blank" rel="noopener">Website</a>';
  if(ho.address)b+='<a class="btn" href="'+mapsG(ho.address)+'" target="_blank" rel="noopener">Route</a>';
  if(b)h+='<div class="btns">'+b+'</div>';
  if(ho.phone)h+='<div><div class="tl-who">Reception phone</div>'+phoneLine(ho.phone)+'</div>';
  if(ho.facts&&ho.facts.length){h+='<dl class="facts">';ho.facts.forEach(function(f){h+='<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>';});h+='</dl>';}
  return h+'</section>';
}
function busCard(d){
  var b=d.bus||{};
  var h='<section class="card"><h3 class="sec-h">Nightliner</h3>';
  h+='<div class="callout">'+(b.call?'<div><b>Bus Call</b><span>'+esc(b.call)+'</span></div>':'')+(b.to?'<div><b>Driving to</b><span>'+esc(b.to)+'</span></div>':'')+(b.km?'<div><b>Distance</b><span>'+esc(b.km)+'</span></div>':'')+(b.drive?'<div><b>Drive time</b><span>'+esc(b.drive)+'</span></div>':'')+(b.arrive?'<div><b>Arrival approx.</b><span>'+esc(b.arrive)+'</span></div>':'')+'</div>';

  return h+'</section>';
}
function venueCard(d){
  var v=d.venue||{};
  if(!v.name&&!v.address&&!v.wifi&&!v.notes&&!(v.facts&&v.facts.length))return '';
  var h='<section class="card"><h3 class="sec-h">Venue</h3>';
  if(v.name)h+='<div class="place-h"><strong>'+esc(v.name)+'</strong></div>';
  h+=addrBlock(v.address);
  if(v.address)h+='<div class="btns"><a class="btn" href="'+mapsG(v.address)+'" target="_blank" rel="noopener">Google Maps</a><a class="btn" href="https://waze.com/ul?navigate=yes&amp;q='+encodeURIComponent(v.address)+'" target="_blank" rel="noopener">Waze</a></div>';
  if(v.facts&&v.facts.length){h+='<dl class="facts">';v.facts.forEach(function(f){h+='<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>';});h+='</dl>';}

function mealsCard(d){

  m.forEach(function(x){
    h+='<div class="meal"><div class="meal-h"><span>'+esc(x.name)+'</span>'+(x.provided?'<span class="chip ok">Provided</span>':'<span class="chip">Own cost</span>')+'</div>'+
      '<small>'+esc([x.place,x.time].filter(Boolean).join(' · '))+'</small>'+(x.note?'<small>'+esc(x.note)+'</small>':'')+'</div>';

function nearbyCard(d){
  var n=d.nearby||[];
  if(!n.length)return '';
  var city=d.city||'',groups=[],by={};
  n.forEach(function(x){var g=x.group||'Eat';if(!by[g]){by[g]=[];groups.push(g);}by[g].push(x);});
  var h='<section class="card"><h3 class="sec-h">Nearby</h3><p class="desc">Tap a name for the map and reviews.</p>';
  groups.forEach(function(g,gi){
    if(groups.length>1||gi>0)h+='<div class="grp">'+esc(g)+'</div>';
    by[g].forEach(function(x){
      var q=x.name+(city?', '+city:'');
      h+='<div class="nb"><a href="'+mapsG(q)+'" target="_blank" rel="noopener">'+esc(x.name)+'</a>'+
        '<small>'+esc([x.type,x.walk?x.walk+' walk':''].filter(Boolean).join(' · '))+'</small>'+(x.hours?'<small class="mono">'+esc(x.hours)+'</small>':'')+'</div>';
    });
  });
  return h+'</section>';
}

function essentialsCard(d){
  var e=d.essentials||[];
  if(!e.length)return '';
  var city=d.city||'',cats=[],by={};
  e.forEach(function(x){var c=x.cat||'Other';if(!by[c]){by[c]=[];cats.push(c);}by[c].push(x);});
  var h='<section class="card"><h3 class="sec-h">Essentials</h3><dl class="facts">';
  cats.forEach(function(c){
    h+='<dt>'+esc(c)+'</dt><dd>'+by[c].map(function(x){return '<a href="'+mapsG(x.name+(city?', '+city:''))+'" target="_blank" rel="noopener">'+esc(x.name)+'</a>'+(x.walk?' <span class="tl-who">('+esc(x.walk)+')</span>':'');}).join(' · ')+'</dd>';
  });
  return h+'</dl><p class="src">Places: Google Maps · walking times are estimates.</p></section>';
}
function cityCard(d){
  var facts=d.facts||[],about=d.about||'',city=d.city||'';
  var h='';
  if(facts.length){
    var i=(st.factIdx||0)%facts.length;
    h+='<section class="card fact"><h3 class="sec-h">Did you know?</h3><p class="fact-t">'+esc(facts[i])+'</p>'+
      (facts.length>1?'<div class="btns"><button type="button" class="btn" data-act="fact">Another one</button></div>':'')+'</section>';
  }
  var sights=d.sights||[];
  if(about||city||sights.length){

function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function readDay(){

  d.essentials=lines(val('d_ess')).map(function(a){return {cat:a[0]||'',name:a[1]||'',walk:a[2]||''};}).filter(function(x){return x.name;});
  d.facts=String(val('d_facts')).split('\n').map(function(s){return s.trim();}).filter(Boolean);
  d.about=val('d_about');
  d.sights=lines(val('d_sights')).map(function(a){return {name:a[0]||'',walk:a.slice(1).join(' | ')};}).filter(function(x){return x.name;});
  d.travelNext=val('d_next');
  d.nearby=lines(val('d_near')).map(function(a){return {name:a[0]||'',type:a[1]||'',walk:a[2]||'',hours:a[3]||'',group:a[4]||''};}).filter(function(x){return x.name;});
  d.hotel={name:val('h_name'),who:val('h_who'),stars:+val('h_stars')||0,checkIn:val('h_in'),checkOut:val('h_out'),address:val('h_addr'),website:val('h_web'),phone:val('h_phone'),description:val('h_desc'),
    facts:lines(val('h_facts')).map(function(a){return [a[0]||'',a.slice(1).join(' | ')];})};

    '<script type="application/json" id="tour">'+json+'<\/script>\n\n<script id="appjs">'+JS_SRC+'<\/script>\n</body></html>';

function save(){
  var e=st.edit,next=JSON.parse(JSON.stringify(data)),goto=st.date;
  if(e.type==='tour'){
    next.tour={name:val('t_name')||'Tour',subtitle:val('t_sub'),tmName:val('t_tmname'),tmPhone:val('t_tmphone')};
    next.contacts=lines(val('t_contacts')).map(function(a){return {role:a[0]||'',name:a[1]||'',phone:a[2]||'',email:a[3]||''};});
    next.notes=val('t_notes');
  } else {
    var d=readDay();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){st.msg='Please enter a valid date.';st.err=true;return render();}
    if(!d.city){st.msg='Please enter a city.';st.err=true;return render();}
    next.days=next.days.filter(function(x){return x.date!==e.orig&&x.date!==d.date;});
    if(!e.isNew||true){}
    if(dayBy(d.date)&&d.date!==e.orig&&!st.overwriteOk){st.overwriteOk=true;st.msg='There is already a day on '+fmtShort(d.date)+'. Save again to replace it.';st.err=true;return render();}
    next.days.push(d);sortDays(next);goto=d.date;
  }
  publish(next,goto);
}
function del(){
  if(!st.confirmDel){st.confirmDel=true;return render();}
  var e=st.edit,next=JSON.parse(JSON.stringify(data));
  next.days=next.days.filter(function(x){return x.date!==e.orig;});
  var i=idxOf(e.orig),g=next.days[Math.min(i,next.days.length-1)];
  publish(next,g?g.date:'');
}
function standalone(){return !(window.claude&&typeof window.claude.use==='function');}
function downloadPage(next){
  st.saving=true;st.msg='';st.err=false;render();
  buildPage(next).then(function(html){
    var blob=new Blob([html],{type:'text/html'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
    data=norm(JSON.parse(JSON.stringify(next)));st.saving=false;st.edit=null;
    st.notice='Downloaded index.html with your changes. Upload it to your web host to publish them for everyone.';
    render();
  },function(){st.saving=false;st.msg='Could not build the file. Please try again.';st.err=true;render();});
}
var GH={owner:'sascbraun',repo:'thewitcher',path:'index.html',branch:'main'};
function ghToken(){try{return localStorage.getItem('daysheet-gh-token')||'';}catch(e){return '';}}
function ghApi(method,body){
  return fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path+(method==='GET'?'?ref='+GH.branch:''),{
    method:method,headers:{'Authorization':'Bearer '+ghToken(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined,cache:'no-store'});
}
function utf8b64(str){var b=new TextEncoder().encode(str),out='',CH=0x8000;for(var i=0;i<b.length;i+=CH)out+=String.fromCharCode.apply(null,b.subarray(i,i+CH));return btoa(out);}
function ghError(r){
  if(!r)return 'Could not reach GitHub. Check the connection and try again.';
  if(r.status===401||r.status===403)return 'The GitHub key is not valid or cannot write to the website. Check it under Website settings.';
  if(r.status===404)return 'Website repository not found. Check the GitHub key under Website settings.';
  if(r.status===409||r.status===422)return 'Someone else saved just now. Reload the page and make your change again.';
  return 'Saving to the website did not work (GitHub '+r.status+'). Please try again.';
}
function saveToGitHub(next){
  st.saving=true;st.msg='';st.err=false;render();
  var html;
  buildPage(next).then(function(h){html=h;return ghApi('GET');})
  .then(function(r){if(!r.ok)throw r;return r.json();})
  .then(function(cur){return ghApi('PUT',{message:'Update daysheet (admin)',content:utf8b64(html),sha:cur.sha,branch:GH.branch});})
  .then(function(r){if(!r.ok)throw r;
    data=norm(JSON.parse(JSON.stringify(next)));st.saving=false;st.edit=null;
    st.notice='Saved to the website. Everyone sees the change in about a minute (pull down or reload to refresh).';render();})
  .catch(function(r){st.saving=false;st.msg=ghError(r&&r.status?r:null);st.err=true;render();});
}
function ghSettingsView(){
  var has=!!ghToken();
  return '<div class="sheet gut" role="dialog" aria-modal="true" aria-label="Website settings"><div class="col login"><form class="card" id="ghform">'+
    '<h2 class="login-h">Website</h2><p class="desc">Connect this device to the website so Save publishes changes directly to <b>'+GH.owner+'.github.io/'+GH.repo+'</b>. The key is stored only on this device.</p>'+
    '<div class="f"><label for="gh_tok">GitHub key</label><input id="gh_tok" type="password" autocomplete="off" placeholder="'+(has?'Key saved on this device':'github_pat_…')+'"><span class="hint">Create it on github.com: Settings → Developer settings → Fine-grained tokens → Generate. Repository access: only '+GH.repo+'. Permission: Contents → Read and write.</span></div>'+
    (st.ghMsg?'<p class="status'+(st.ghErr?' err':'')+'" role="status">'+esc(st.ghMsg)+'</p>':'')+
    '<div class="btns"><button class="btn primary" type="submit">'+(st.ghBusy?'Checking …':'Save key')+'</button>'+(has?'<button class="btn danger" type="button" data-act="gh-remove">Remove key</button>':'')+'<button class="btn" type="button" data-act="gh-close">Close</button></div></form></div></div>';
}
function publish(next,goto){
  if(!ART&&standalone())return ghToken()?saveToGitHub(next):downloadPage(next);
  if(!ART){st.msg='Not saved: saving is not possible in this view. Open the page in Claude with Editor access.';st.err=true;return render();}
  st.saving=true;st.msg='';st.err=false;render();
  ss('daysheet-return',(goto||'')+'|'+(st.edit.type==='tour'?'contacts':'day'));
  buildPage(next).then(function(html){return ART.publish(html);}).then(function(){st.msg='Saved';render();},function(err){
    st.saving=false;var c=err&&err.code;
    if(c==='conflict'){st.msg='Someone else just saved. The page is reloading.';}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'){ss('daysheet-return',null);st.msg='Not saved: this account needs Editor access to the page (Share menu). Ask the tour manager.';}
    else if(c==='too_large'){ss('daysheet-return',null);st.msg='Too much data for one page. Delete some past days.';}
    else {ss('daysheet-return',null);st.msg='Saving did not work. Please try again in a moment.';}
    st.err=true;render();
  });
}

/* ---------- events ---------- */
function go(date,view){st.date=date||st.date;st.view=view||'day';render();window.scrollTo(0,0);}
app.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),i=idxOf(st.date);
  if(a==='prev'&&i>0)go(data.days[i-1].date,'day');
  else if(a==='next'&&i<data.days.length-1)go(data.days[i+1].date,'day');
  else if(a==='view'){st.view=b.getAttribute('data-v');render();}
  else if(a==='today')go(todayISO(),'day');
  else if(a==='admin'&&ENC&&!st.isAdmin){st.adminLogin=true;st.loginMsg='';render();var f=document.getElementById('al_pw');if(f)f.focus();}
  else if(a==='gh-open'){st.ghSettings=true;st.ghMsg='';render();}
  else if(a==='gh-close'){st.ghSettings=false;render();}
  else if(a==='gh-remove'){try{localStorage.removeItem('daysheet-gh-token');}catch(e){}st.ghMsg='Key removed from this device.';st.ghErr=false;render();}
  else if(a==='admin-cancel'){st.adminLogin=false;render();}
  else if(a==='admin'){st.admin=!st.admin;try{sessionStorage.setItem('daysheet-admin',st.admin?'1':'');}catch(e){}render();}
  else if(a==='signout')signOut();
  else if(a==='fact'){st.factIdx=(st.factIdx||0)+1;render();}
  else if(a==='go')go(b.getAttribute('data-v'),'day');
  else if(a==='copy'){
    var t=b.getAttribute('data-v'),done=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy';},1500);};
    try{navigator.clipboard.writeText(t).then(done,function(){selectNear(b);});}catch(e){selectNear(b);}
  }
  else if(a==='edit'){var d=dayBy(st.date);st.edit={type:'day',day:JSON.parse(JSON.stringify(d)),orig:d.date};resetEd();render();}
  else if(a==='dup'){var s=JSON.parse(JSON.stringify(dayBy(st.date)));s.date=addDays(data.days[data.days.length-1].date,1);st.edit={type:'day',day:s,orig:null,isNew:true};resetEd();render();}
  else if(a==='new'){var last=data.days.length?addDays(data.days[data.days.length-1].date,1):todayISO();st.edit={type:'day',day:{date:last,kind:'show',sleep:'hotel'},orig:null,isNew:true};resetEd();render();}
  else if(a==='edittour'){st.edit={type:'tour'};resetEd();render();}
  else if(a==='cancel'){st.edit=null;resetEd();render();}
  else if(a==='save'){if(!st.saving)save();}
  else if(a==='del'){if(!st.saving)del();}
});
function resetEd(){st.msg='';st.err=false;st.confirmDel=false;st.overwriteOk=false;st.saving=false;}
function selectNear(b){var s=b.parentNode.querySelector('.mono');if(!s)return;var r=document.createRange();r.selectNodeContents(s);var w=getSelection();w.removeAllRanges();w.addRange(r);}
app.addEventListener('submit',function(ev){

    ev.preventDefault();var t=document.getElementById('gh_tok').value.trim();
    if(!t){st.ghMsg='Paste the GitHub key first.';st.ghErr=true;return render();}
    var old=ghToken();try{localStorage.setItem('daysheet-gh-token',t);}catch(e){st.ghMsg='This browser cannot store the key.';st.ghErr=true;return render();}
    st.ghBusy=true;st.ghMsg='';render();
    ghApi('GET').then(function(r){st.ghBusy=false;
      if(r.ok){st.ghMsg='Connected. Save now publishes to the website.';st.ghErr=false;}
      else{try{if(old)localStorage.setItem('daysheet-gh-token',old);else localStorage.removeItem('daysheet-gh-token');}catch(e){}st.ghMsg=ghError(r);st.ghErr=true;}
      render();
    },function(){st.ghBusy=false;try{if(old)localStorage.setItem('daysheet-gh-token',old);else localStorage.removeItem('daysheet-gh-token');}catch(e){}st.ghMsg=ghError(null);st.ghErr=true;render();});
    return;
  }
  if(ev.target.id==='adminform'){
    ev.preventDefault();
    var au=document.getElementById('al_user').value,ap=document.getElementById('al_pw').value;
    if(String(au).trim().toLowerCase()!=='admin'||!ENC.admin){st.loginMsg='Wrong admin login or password.';return render();}
    adminKey(au,ap).then(function(){
      st.isAdmin=true;st.admin=true;st.adminLogin=false;st.loginMsg='';
      try{sessionStorage.setItem('daysheet-admin','1');if(localStorage.getItem('daysheet-key-'+ENC.salt))localStorage.setItem('daysheet-role-'+ENC.salt,'admin');}catch(e){}
      render();
    }).catch(function(){st.loginMsg='Wrong admin login or password.';render();});
    return;
  }
  if(ev.target.id!=='loginform')return;ev.preventDefault();
  var u=document.getElementById('lg_user').value,pw=document.getElementById('lg_pw').value,rem=document.getElementById('lg_rem').checked;
  if(!window.crypto||!crypto.subtle){st.loginMsg='This browser cannot open the daysheet. Please try another browser.';return render();}
  st.loggingIn=true;st.loginMsg='';render();
  var isAdm=String(u).trim().toLowerCase()==='admin'&&ENC.admin;
  (isAdm?adminKey(u,pw):deriveKey(u,pw)).then(function(k){return unlock(k,rem,!!isAdm);}).catch(function(){st.loggingIn=false;st.loginMsg='Wrong login or password.';render();var f=document.getElementById('lg_user');if(f)f.value=u;});
});
app.addEventListener('change',function(ev){if(ev.target.id==='daysel')go(ev.target.value,'day');});
document.addEventListener('keydown',function(ev){
  if(st.ghSettings){if(ev.key==='Escape'){st.ghSettings=false;render();}return;}
  if(st.adminLogin){if(ev.key==='Escape'){st.adminLogin=false;render();}return;}
  if(st.edit){if(ev.key==='Escape'&&!st.saving){st.edit=null;render();}return;}
  if(/input|select|textarea/i.test((ev.target.tagName||'')))return;
  var i=idxOf(st.date);
  if(ev.key==='ArrowLeft'&&i>0)go(data.days[i-1].date,'day');
  if(ev.key==='ArrowRight'&&i>=0&&i<data.days.length-1)go(data.days[i+1].date,'day');
});

try{st.admin=sessionStorage.getItem('daysheet-admin')==='1';}catch(e){}
render();
if(ENC)tryRemembered().catch(function(){});

/* ---------- capabilities: editors may save ---------- */
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(a){ART=a;return a?window.claude.use('user'):null;})
  .then(function(u){return u?u.canEdit():false;})
  .then(function(ok){if(ok){st.canWrite=true;render();}})
  .catch(function(){});
}
})();
</script>
